[package]
name = "shared-services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors", "compression-full", "auth"] }
tonic = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry-jaeger = { workspace = true, features = ["rt-tokio"] }
metrics = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
common = { path = "../common" }
tenant = { path = "../tenant" }
ed25519-dalek = { workspace = true }
ring = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
