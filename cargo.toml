[workspace]
members = [
    "common",
    "auth",
    "tenant",
    "evidence",
    "compliance-engine",
    "policy-dsl",
    "risk-engine",
    "graph",
    "graph-intelligence",
    "event-bus",
    "workflow",
    "audit",
    "observability",
    "security",
    "integrations",
    "regulatory",
    "api-gateway",
    "shared-services",
    "event-contracts",
    "grpc-contracts",
    "db",
    "cyber-defense",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Enterprise GRC Team"]
license = "Proprietary"
repository = "https://github.com/enterprise/grc-core"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.21"

# HTTP frameworks
axum = "0.7"
axum-extra = { version = "0.8", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-full"] }
hyper = { version = "1.1", features = ["full"] }

# gRPC
tonic = "0.10"
tonic-build = "0.10"
prost = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Database
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-native-tls", "json", "uuid", "chrono", "macros"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
neo4rs = "0.7"
deadpool-postgres = "0.12"
sqlx-cli = "0.9"

# Event streaming
confluent-kafka = "0.35"
schema-registry = "0.14"

# Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "aio"] }
moka = { version = "0.12", features = ["future"] }

# Cryptography
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["hazmat"] }
ring = "0.17"
rustls = "0.21"
rustls-pemfile = "2.0"
jsonwebtoken = "9.2"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
base64 = "0.21"

# Observability
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }
opentelemetry-jaeger = { version = "0.20", features = ["rt-tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.22"
prometheus = "0.13"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
config = "0.13"
clap = { version = "4.4", features = ["derive"] }
tracing-log = "0.2"

# Graph
graph = "0.3"
petgraph = "0.6"

# Testing
tokio-test = "0.4"
mockito = "1.2"
testcontainers = "0.15"
criterion = "0.5"

# Async utilities
async-stream = "0.3"
futures = "0.3"
async-trait = "0.1"

# Time
time = "0.3"
chrono-tz = "0.8"

# Validation
regex = "1.10"
validator = { version = "0.16", features = ["derive"] }

# Error handling
backtrace = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true

